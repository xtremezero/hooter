<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journals 📔</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pitch: '#000000',
                        surface: '#0a0a0a',
                        card: '#111111',
                        borderSubtle: '#222222',
                        gold: {
                            100: '#fcf8e3',
                            200: '#f7edb8',
                            300: '#f0df88',
                            400: '#e5c158',
                            500: '#d4af37',
                            600: '#b89228',
                            700: '#91711e',
                            800: '#6d5418'
                        }
                    }
                }
            }
        };
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .journal-text {
            font-family: 'Lora', serif;
        }

        /* Custom subtle scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        .dark ::-webkit-scrollbar-track {
            background: #000000;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #333333;
        }

        ::-webkit-scrollbar-track {
            background: #FAF8F5;
        }
        ::-webkit-scrollbar-thumb {
            background: #d6d3d1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a29e;
        }
    </style>
</head>

<body class="bg-[#FAF8F5] text-stone-800 dark:bg-pitch dark:text-neutral-200 selection:bg-stone-300 selection:text-stone-900 dark:selection:bg-gold-500/30 dark:selection:text-gold-200 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Inline SVG Icons ---
        const Icon = ({ d, size = 24, className = "", fill = "none" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} fill={fill} dangerouslySetInnerHTML={{ __html: d }} />
        );

        const BookOpen = (p) => <Icon {...p} d='<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>' />;
        const Home = (p) => <Icon {...p} d='<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>' />;
        const Search = (p) => <Icon {...p} d='<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>' />;
        const Download = (p) => <Icon {...p} d='<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>' />;
        const Upload = (p) => <Icon {...p} d='<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>' />;
        const ImageIcon = (p) => <Icon {...p} d='<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>' />;
        const PenTool = (p) => <Icon {...p} d='<path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.586 7.586"/><circle cx="11" cy="11" r="2"/>' />;
        const Trash2 = (p) => <Icon {...p} d='<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>' />;
        const Heart = (p) => <Icon {...p} d='<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>' />;
        const X = (p) => <Icon {...p} d='<path d="M18 6 6 18"/><path d="m6 6 12 12"/>' />;
        const Camera = (p) => <Icon {...p} d='<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>' />;
        const Sun = (p) => <Icon {...p} d='<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>' />;
        const Moon = (p) => <Icon {...p} d='<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>' />;
        const Monitor = (p) => <Icon {...p} d='<rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>' />;

        const defaultUser = {
            id: 'user_1',
            name: 'Dear Diary',
            handle: '@mythoughts',
            avatar: 'data:image/svg+xml;charset=UTF-8,%3csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23faf8f5" stroke="%23d4af37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="background-color:%23111111;"%3e%3cpath d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/%3e%3cpath d="M8 7h6" stroke="%23888888"/%3e%3cpath d="M8 11h4" stroke="%23888888"/%3e%3cpath d="m18 6-7.5 7.5-2 1 1-2L17 5l2 1z" fill="%23d4af37"/%3e%3cpath d="m16.5 5.5 1 1"/%3e%3c/svg%3e'
        };

        const defaultEntries = [
            {
                id: 'e_1',
                author: defaultUser,
                content: 'Welcome to your digital journal. Your thoughts are stored securely in your browser.\n\nTake a moment to reflect on your day, attach a memory, or toggle between Light and Pitch-Black Gold mode anytime.',
                timestamp: new Date().toISOString(),
                likes: 1,
                likedByMe: true
            }
        ];

        const resizeImage = (file, maxWidth, callback) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        function HighlightText({ text = "", query = "" }) {
            const trimmedQuery = query.trim();
            if (!trimmedQuery || !text) return <span>{text}</span>;

            try {
                const escaped = trimmedQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`(${escaped})`, 'gi');
                const parts = String(text).split(regex);

                return (
                    <span>
                        {parts.map((part, index) =>
                            part.toLowerCase() === trimmedQuery.toLowerCase() ? (
                                <mark key={index} className="bg-amber-200 text-stone-900 dark:bg-gold-500/20 dark:text-gold-300 dark:border dark:border-gold-500/30 rounded px-1 font-medium">
                                    {part}
                                </mark>
                            ) : (
                                part
                            )
                        )}
                    </span>
                );
            } catch (e) {
                return <span>{text}</span>;
            }
        }

        function App() {
            const [themeMode, setThemeMode] = useState(() => {
                const savedTheme = localStorage.getItem('local_journal_theme');
                if (savedTheme === 'system' || savedTheme === 'light' || savedTheme === 'dark') {
                    return savedTheme;
                }
                if (savedTheme === 'true') return 'dark';
                if (savedTheme === 'false') return 'light';
                return 'system';
            });

            const [entries, setEntries] = useState([]);
            const [currentUser, setCurrentUser] = useState(defaultUser);

            const [entryInput, setEntryInput] = useState('');
            const [selectedImage, setSelectedImage] = useState(null);

            const [isEditingProfile, setIsEditingProfile] = useState(false);
            const [editProfileData, setEditProfileData] = useState(currentUser);

            const [searchQuery, setSearchQuery] = useState('');
            const [isMobileSearchOpen, setIsMobileSearchOpen] = useState(false);

            const fileInputRef = useRef(null);
            const imageInputRef = useRef(null);
            const avatarInputRef = useRef(null);
            const searchInputRef = useRef(null);
            const mobileSearchInputRef = useRef(null);

            useEffect(() => {
                const root = document.documentElement;
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');

                const updateTheme = () => {
                    const isDark = themeMode === 'system' 
                        ? mediaQuery.matches 
                        : themeMode === 'dark';

                    if (isDark) {
                        root.classList.add('dark');
                    } else {
                        root.classList.remove('dark');
                    }
                };

                updateTheme();
                localStorage.setItem('local_journal_theme', themeMode);

                if (themeMode === 'system') {
                    const handler = () => updateTheme();
                    if (mediaQuery.addEventListener) {
                        mediaQuery.addEventListener('change', handler);
                        return () => mediaQuery.removeEventListener('change', handler);
                    } else if (mediaQuery.addListener) {
                        mediaQuery.addListener(handler);
                        return () => mediaQuery.removeListener(handler);
                    }
                }
            }, [themeMode]);

            const cycleThemeMode = () => {
                setThemeMode(prev => {
                    if (prev === 'system') return 'light';
                    if (prev === 'light') return 'dark';
                    return 'system';
                });
            };

            useEffect(() => {
                try {
                    const storedEntries = localStorage.getItem('local_journal_entries') || localStorage.getItem('local_hooter_hoots');
                    const storedUser = localStorage.getItem('local_journal_user') || localStorage.getItem('local_hooter_user');

                    if (storedEntries) setEntries(JSON.parse(storedEntries));
                    else setEntries(defaultEntries);

                    if (storedUser) {
                        const parsedUser = JSON.parse(storedUser);
                        if (parsedUser.avatar && parsedUser.avatar.includes('dicebear.com/7.x/notionists')) {
                            parsedUser.avatar = defaultUser.avatar;
                        }
                        setCurrentUser(parsedUser);
                    }
                } catch (e) {
                    console.error('Failed to load local data', e);
                    setEntries(defaultEntries);
                }
            }, []);

            useEffect(() => {
                try {
                    localStorage.setItem('local_journal_entries', JSON.stringify(entries));
                    localStorage.setItem('local_journal_user', JSON.stringify(currentUser));
                } catch (e) {
                    console.error('Storage quota exceeded or error saving data', e);
                }
            }, [entries, currentUser]);

            const formatTime = (isoString) => {
                const date = new Date(isoString);
                return date.toLocaleDateString('en-US', {
                    weekday: 'long',
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric',
                    hour: 'numeric',
                    minute: '2-digit'
                });
            };

            const filteredEntries = useMemo(() => {
                const q = searchQuery.trim().toLowerCase();
                if (!q) return entries;

                return entries.filter((entry) => {
                    const contentMatch = (entry.content || '').toLowerCase().includes(q);
                    const authorNameMatch = (entry.author?.name || '').toLowerCase().includes(q);
                    const authorHandleMatch = (entry.author?.handle || '').toLowerCase().includes(q);
                    const dateMatch = formatTime(entry.timestamp).toLowerCase().includes(q);

                    return contentMatch || authorNameMatch || authorHandleMatch || dateMatch;
                });
            }, [entries, searchQuery]);

            const handleImageSelect = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                resizeImage(file, 800, setSelectedImage);
                e.target.value = '';
            };

            const handleAvatarSelect = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                resizeImage(file, 200, (resizedDataUrl) => {
                    setEditProfileData({ ...editProfileData, avatar: resizedDataUrl });
                });
                e.target.value = '';
            };

            const handlePostEntry = (e) => {
                e.preventDefault();
                if (!entryInput.trim() && !selectedImage) return;

                const newEntry = {
                    id: `e_${Date.now()}`,
                    author: currentUser,
                    content: entryInput.trim(),
                    image: selectedImage,
                    timestamp: new Date().toISOString(),
                    likes: 0,
                    likedByMe: false
                };

                setEntries([newEntry, ...entries]);
                setEntryInput('');
                setSelectedImage(null);
            };

            const toggleLike = (entryId) => {
                setEntries(entries.map(e => {
                    if (e.id === entryId) {
                        return { ...e, likes: e.likedByMe ? e.likes - 1 : e.likes + 1, likedByMe: !e.likedByMe };
                    }
                    return e;
                }));
            };

            const deleteEntry = (entryId) => setEntries(entries.filter(e => e.id !== entryId));

            const handleSaveProfile = (e) => {
                e.preventDefault();
                setCurrentUser(editProfileData);
                setEntries(entries.map(en => en.author.id === currentUser.id ? { ...en, author: editProfileData } : en));
                setIsEditingProfile(false);
            };

            const handleBackup = () => {
                const exportData = { version: '1.0', timestamp: new Date().toISOString(), entries, user: currentUser };
                const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `journal-backup-${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            const handleRestoreFile = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.entries) setEntries(data.entries);
                        else if (data.hoots) setEntries(data.hoots);

                        if (data.user) setCurrentUser(data.user);
                    } catch (err) {
                        console.error("Failed to parse backup file.", err);
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const handlePromptClick = (topicText) => {
                setEntryInput((prev) => (prev ? `${prev}\n\n${topicText}\n` : `${topicText}\n`));
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const currentDateStr = new Date().toLocaleDateString('en-US', {
                weekday: 'long',
                month: 'long',
                day: 'numeric'
            });

            return (
                <div className="min-h-screen">
                    <div className="max-w-7xl mx-auto flex sm:px-6 lg:px-8">

                        {/* --- SIDEBAR --- */}
                        <header className="w-20 lg:w-64 py-4 flex flex-col justify-between sticky top-0 h-screen border-r border-stone-200 dark:border-borderSubtle bg-[#FAF8F5] dark:bg-pitch transition-colors">
                            <div className="flex flex-col items-center lg:items-start gap-2 lg:gap-4 px-2 lg:px-6">
                                <div className="p-3 mb-2 flex items-center gap-3 text-stone-800 dark:text-neutral-100">
                                    <BookOpen size={32} className="text-stone-700 dark:text-gold-500" />
                                    <span className="hidden lg:block text-2xl font-bold tracking-tight font-serif">Journals</span>
                                </div>
                                <SidebarItem icon={<Home size={26} />} label="My Journal" active />

                                <button
                                    onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
                                    className="hidden lg:flex w-full mt-4 bg-stone-800 hover:bg-stone-700 text-stone-50 dark:bg-gradient-to-r dark:from-gold-600 dark:via-gold-500 dark:to-gold-400 dark:hover:from-gold-500 dark:hover:to-gold-300 dark:text-black font-semibold py-3 px-8 rounded-xl justify-center transition-all shadow-md dark:shadow-[0_0_15px_rgba(212,175,55,0.25)]"
                                >
                                    Write Entry
                                </button>
                                <button
                                    onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
                                    className="lg:hidden mt-4 bg-stone-800 hover:bg-stone-700 text-stone-50 dark:bg-gold-500 dark:hover:bg-gold-400 dark:text-black p-3 rounded-full transition-all shadow-md"
                                >
                                    <PenTool size={24} />
                                </button>
                            </div>

                            <div className="px-2 lg:px-6 flex flex-col gap-2">
                                {/* Dynamic Theme Switcher (System / Light / Dark) */}
                                <div className="mb-2">
                                    <div className="hidden lg:block text-xs text-stone-400 dark:text-neutral-500 mb-1.5 uppercase tracking-widest font-semibold px-1">
                                        Theme
                                    </div>
                                    {/* 3-Option Segmented Control for Large Screens */}
                                    <div className="hidden lg:grid grid-cols-3 gap-1 bg-stone-200/60 dark:bg-surface border border-stone-200 dark:border-neutral-800/80 p-1 rounded-xl">
                                        <button
                                            type="button"
                                            onClick={() => setThemeMode('system')}
                                            className={`flex flex-col items-center justify-center py-2 px-1 rounded-lg text-xs font-semibold transition-all ${
                                                themeMode === 'system'
                                                    ? 'bg-white text-stone-900 shadow-sm dark:bg-gold-500 dark:text-black font-bold'
                                                    : 'text-stone-600 hover:text-stone-900 dark:text-neutral-400 dark:hover:text-neutral-200'
                                            }`}
                                            title="System theme preference"
                                        >
                                            <Monitor size={15} />
                                            <span className="text-[11px] mt-0.5">System</span>
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setThemeMode('light')}
                                            className={`flex flex-col items-center justify-center py-2 px-1 rounded-lg text-xs font-semibold transition-all ${
                                                themeMode === 'light'
                                                    ? 'bg-white text-stone-900 shadow-sm dark:bg-gold-500 dark:text-black font-bold'
                                                    : 'text-stone-600 hover:text-stone-900 dark:text-neutral-400 dark:hover:text-neutral-200'
                                            }`}
                                            title="Light theme"
                                        >
                                            <Sun size={15} className={themeMode === 'light' ? 'text-amber-600 dark:text-black' : 'text-amber-500'} />
                                            <span className="text-[11px] mt-0.5">Light</span>
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setThemeMode('dark')}
                                            className={`flex flex-col items-center justify-center py-2 px-1 rounded-lg text-xs font-semibold transition-all ${
                                                themeMode === 'dark'
                                                    ? 'bg-white text-stone-900 shadow-sm dark:bg-gold-500 dark:text-black font-bold'
                                                    : 'text-stone-600 hover:text-stone-900 dark:text-neutral-400 dark:hover:text-neutral-200'
                                            }`}
                                            title="Dark theme (Pitch Black)"
                                        >
                                            <Moon size={15} />
                                            <span className="text-[11px] mt-0.5">Dark</span>
                                        </button>
                                    </div>

                                    {/* Cycle button for narrow sidebar view (medium screens) */}
                                    <button
                                        type="button"
                                        onClick={cycleThemeMode}
                                        className="lg:hidden flex items-center justify-center p-3 hover:bg-stone-200/50 dark:hover:bg-surface rounded-xl cursor-pointer transition-all w-full text-stone-600 dark:text-neutral-400 border border-transparent dark:border-neutral-800/80"
                                        title={`Theme: ${themeMode} (Click to toggle)`}
                                    >
                                        {themeMode === 'system' && <Monitor size={22} className="text-stone-700 dark:text-gold-400" />}
                                        {themeMode === 'light' && <Sun size={22} className="text-amber-500" />}
                                        {themeMode === 'dark' && <Moon size={22} className="text-gold-400" />}
                                    </button>
                                </div>

                                <div className="hidden lg:block text-xs text-stone-400 dark:text-neutral-500 mt-2 mb-1 uppercase tracking-widest font-semibold">Data</div>
                                <button onClick={handleBackup} className="flex items-center gap-4 p-3 hover:bg-stone-200/50 dark:hover:bg-surface dark:hover:text-gold-400 rounded-xl cursor-pointer transition-colors w-full text-left text-stone-600 dark:text-neutral-400">
                                    <Download size={22} />
                                    <span className="hidden lg:inline text-[17px] font-medium">Backup</span>
                                </button>
                                <button onClick={() => fileInputRef.current?.click()} className="flex items-center gap-4 p-3 hover:bg-stone-200/50 dark:hover:bg-surface dark:hover:text-gold-400 rounded-xl cursor-pointer transition-colors w-full text-left text-stone-600 dark:text-neutral-400">
                                    <Upload size={22} />
                                    <span className="hidden lg:inline text-[17px] font-medium">Restore</span>
                                </button>
                                <input type="file" accept=".json" ref={fileInputRef} onChange={handleRestoreFile} className="hidden" />

                                <div
                                    onClick={() => { setEditProfileData(currentUser); setIsEditingProfile(true); }}
                                    className="mt-6 flex items-center gap-3 p-3 bg-white dark:bg-surface border border-stone-200 dark:border-neutral-800 hover:border-stone-300 dark:hover:border-gold-500/50 shadow-sm rounded-xl cursor-pointer transition-all w-full group"
                                >
                                    <img src={currentUser.avatar} alt="avatar" className="w-10 h-10 rounded-full bg-stone-100 dark:bg-neutral-900 object-cover border border-stone-200 dark:border-gold-500/40" />
                                    <div className="hidden lg:block flex-1 truncate">
                                        <p className="font-semibold text-sm leading-tight text-stone-800 dark:text-neutral-200 group-hover:text-stone-900 dark:group-hover:text-gold-300">{currentUser.name}</p>
                                        <p className="text-stone-500 dark:text-neutral-500 text-xs mt-0.5 leading-tight">{currentUser.handle}</p>
                                    </div>
                                </div>
                            </div>
                        </header>

                        {/* --- MAIN CONTENT --- */}
                        <main className="flex-1 max-w-[650px] border-r border-stone-200 dark:border-borderSubtle min-h-screen bg-[#FAF8F5] dark:bg-pitch transition-colors">
                            <div className="sticky top-0 z-10 bg-[#FAF8F5]/95 dark:bg-pitch/90 backdrop-blur-md border-b border-stone-200 dark:border-borderSubtle p-4 sm:p-6 transition-all">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <p className="text-xs sm:text-sm font-medium text-stone-400 dark:text-gold-500/80 uppercase tracking-widest mb-1">{currentDateStr}</p>
                                        <h1 className="text-xl sm:text-2xl font-bold font-serif text-stone-800 dark:text-neutral-100">Your Entries</h1>
                                    </div>

                                    <div className="flex items-center gap-2">
                                        {/* Mobile theme toggle */}
                                        <button
                                            type="button"
                                            onClick={cycleThemeMode}
                                            className="p-2.5 rounded-xl border border-stone-200 dark:border-neutral-800 bg-white dark:bg-surface text-stone-600 dark:text-gold-400 lg:hidden flex items-center gap-1.5"
                                            title={`Theme: ${themeMode} (Click to toggle)`}
                                        >
                                            {themeMode === 'system' && <Monitor size={18} />}
                                            {themeMode === 'light' && <Sun size={18} className="text-amber-500" />}
                                            {themeMode === 'dark' && <Moon size={18} className="text-gold-400" />}
                                            <span className="text-xs font-semibold capitalize hidden sm:inline">{themeMode}</span>
                                        </button>

                                        {/* Mobile search toggle */}
                                        <div className="lg:hidden">
                                            <button
                                                type="button"
                                                onClick={() => {
                                                    setIsMobileSearchOpen(!isMobileSearchOpen);
                                                    if (!isMobileSearchOpen) {
                                                        setTimeout(() => mobileSearchInputRef.current?.focus(), 100);
                                                    }
                                                }}
                                                className={`p-2.5 rounded-xl border transition-colors ${
                                                    isMobileSearchOpen || searchQuery
                                                        ? 'bg-stone-800 text-stone-50 border-stone-800 dark:bg-gold-500 dark:text-black dark:border-gold-500'
                                                        : 'bg-white text-stone-600 border-stone-200 dark:bg-surface dark:text-neutral-400 dark:border-neutral-800'
                                                }`}
                                                title="Search entries"
                                            >
                                                <Search size={18} />
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {isMobileSearchOpen && (
                                    <div className="mt-3.5 pt-3 border-t border-stone-200 dark:border-neutral-800 lg:hidden">
                                        <div className="bg-white dark:bg-surface rounded-xl shadow-inner border border-stone-300 dark:border-neutral-800 flex items-center px-3.5 py-2">
                                            <Search size={18} className="text-stone-400 dark:text-gold-500/70 flex-shrink-0" />
                                            <input
                                                ref={mobileSearchInputRef}
                                                type="text"
                                                value={searchQuery}
                                                onChange={(e) => setSearchQuery(e.target.value)}
                                                placeholder="Search entries, keywords, dates..."
                                                className="bg-transparent border-none outline-none text-stone-800 dark:text-neutral-100 ml-2.5 w-full placeholder-stone-400 dark:placeholder-neutral-600 text-sm font-medium"
                                            />
                                            {searchQuery && (
                                                <button
                                                    type="button"
                                                    onClick={() => setSearchQuery('')}
                                                    className="text-stone-400 hover:text-stone-700 dark:text-neutral-500 dark:hover:text-neutral-200 p-1 ml-1"
                                                >
                                                    <X size={16} />
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* COMPOSER */}
                            {!searchQuery.trim() && (
                                <div className="p-6 border-b border-stone-200 dark:border-borderSubtle bg-white dark:bg-pitch transition-colors">
                                    <form onSubmit={handlePostEntry} className="flex flex-col">
                                        <div className="flex gap-4 mb-4">
                                            <img src={currentUser.avatar} alt="avatar" className="w-10 h-10 rounded-full bg-stone-100 dark:bg-neutral-900 flex-shrink-0 object-cover border border-stone-200 dark:border-neutral-800" />
                                            <textarea
                                                className="w-full bg-transparent text-xl placeholder-stone-400 dark:placeholder-neutral-600 outline-none resize-none border-none focus:ring-0 journal-text mt-1 text-stone-700 dark:text-neutral-200"
                                                placeholder="What's on your mind today?"
                                                rows={4}
                                                value={entryInput}
                                                onChange={(e) => setEntryInput(e.target.value)}
                                            />
                                        </div>

                                        {selectedImage && (
                                            <div className="relative mb-4 ml-14 inline-block">
                                                <img src={selectedImage} alt="Preview" className="max-h-64 rounded-xl shadow-sm border border-stone-200 dark:border-neutral-800 object-contain" />
                                                <button
                                                    type="button"
                                                    onClick={() => setSelectedImage(null)}
                                                    className="absolute top-2 right-2 bg-stone-800/80 hover:bg-stone-900 dark:bg-black/80 dark:hover:bg-black text-white p-1.5 rounded-full transition-colors backdrop-blur-sm"
                                                >
                                                    <X size={16} />
                                                </button>
                                            </div>
                                        )}

                                        <div className="flex justify-between items-center ml-14 border-t border-stone-100 dark:border-neutral-900 pt-3">
                                            <div className="flex gap-2 text-stone-400 dark:text-neutral-500">
                                                <button type="button" onClick={() => imageInputRef.current?.click()} className="p-2 hover:bg-stone-100 dark:hover:bg-surface hover:text-stone-700 dark:hover:text-gold-400 rounded-full cursor-pointer transition-colors" title="Attach an image">
                                                    <ImageIcon size={20} />
                                                </button>
                                                <input type="file" accept="image/*" ref={imageInputRef} onChange={handleImageSelect} className="hidden" />
                                            </div>
                                            <button
                                                type="submit"
                                                disabled={!entryInput.trim() && !selectedImage}
                                                className="bg-stone-800 hover:bg-stone-700 dark:bg-gold-500 dark:hover:bg-gold-400 dark:text-black disabled:opacity-40 dark:disabled:opacity-30 disabled:cursor-not-allowed text-stone-50 font-semibold py-2 px-6 rounded-full transition-all text-sm shadow-sm dark:shadow-[0_0_12px_rgba(212,175,55,0.25)]"
                                            >
                                                Save Entry
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            )}

                            {/* FEED */}
                            <div className="p-6 pb-20 space-y-6">
                                {searchQuery.trim() && (
                                    <div className="flex items-center justify-between bg-stone-100/90 dark:bg-surface border border-stone-200 dark:border-neutral-800 px-4 py-3 rounded-xl shadow-sm">
                                        <div className="text-sm text-stone-600 dark:text-neutral-400 flex items-center gap-2">
                                            <Search size={16} className="text-stone-400 dark:text-gold-500" />
                                            <span>
                                                Found <span className="font-bold text-stone-900 dark:text-gold-400">{filteredEntries.length}</span> {filteredEntries.length === 1 ? 'entry' : 'entries'} for &ldquo;<span className="font-semibold text-stone-800 dark:text-neutral-200">{searchQuery}</span>&rdquo;
                                            </span>
                                        </div>
                                        <button
                                            onClick={() => setSearchQuery('')}
                                            className="text-xs font-semibold text-stone-500 hover:text-stone-900 dark:text-gold-500 dark:hover:text-gold-400 underline ml-3 transition-colors"
                                        >
                                            Clear search
                                        </button>
                                    </div>
                                )}

                                {filteredEntries.map(entry => (
                                    <article key={entry.id} className="bg-white dark:bg-card border border-stone-200 dark:border-neutral-800/80 hover:dark:border-gold-500/40 rounded-2xl p-6 shadow-sm hover:shadow-md transition-all">
                                        <div className="flex justify-between items-start mb-4 border-b border-stone-100 dark:border-neutral-900 pb-4">
                                            <div className="flex items-center gap-3">
                                                <img src={entry.author.avatar} alt="avatar" className="w-10 h-10 rounded-full bg-stone-100 dark:bg-neutral-900 flex-shrink-0 object-cover border border-stone-200 dark:border-neutral-800" />
                                                <div>
                                                    <div className="font-semibold text-stone-800 dark:text-neutral-200">
                                                        <HighlightText text={entry.author.name} query={searchQuery} />
                                                    </div>
                                                    <div className="text-xs text-stone-500 dark:text-neutral-500 font-medium">
                                                        <HighlightText text={formatTime(entry.timestamp)} query={searchQuery} />
                                                    </div>
                                                </div>
                                            </div>

                                            {entry.author.id === currentUser.id && (
                                                <button onClick={() => deleteEntry(entry.id)} className="text-stone-300 hover:text-red-500 dark:text-neutral-600 dark:hover:text-red-400 p-2 rounded-full hover:bg-red-50 dark:hover:bg-red-500/10 transition-colors" title="Delete Entry">
                                                    <Trash2 size={18} />
                                                </button>
                                            )}
                                        </div>

                                        <p className="journal-text text-[17px] text-stone-800 dark:text-neutral-300 whitespace-pre-wrap break-words leading-relaxed">
                                            <HighlightText text={entry.content} query={searchQuery} />
                                        </p>

                                        {entry.image && (
                                            <img src={entry.image} alt="Journal attachment" className="mt-5 rounded-xl w-full border border-stone-200 dark:border-neutral-800 shadow-sm object-cover max-h-[500px]" />
                                        )}

                                        <div className="flex justify-start mt-4 border-t border-stone-50 dark:border-neutral-900 pt-3 text-stone-400 dark:text-neutral-500">
                                            <button
                                                onClick={() => toggleLike(entry.id)}
                                                className={`flex items-center gap-2 group transition-colors ${entry.likedByMe ? 'text-amber-500 dark:text-gold-400' : 'hover:text-amber-500 dark:hover:text-gold-400'}`}
                                                title="Favorite this entry"
                                            >
                                                <div className="p-2 rounded-full group-hover:bg-amber-50 dark:group-hover:bg-gold-500/10 transition-colors">
                                                    <Heart size={20} fill={entry.likedByMe ? 'currentColor' : 'none'} className={entry.likedByMe ? 'text-amber-500 dark:text-gold-400' : ''} />
                                                </div>
                                                {entry.likes > 0 && <span className="text-sm font-medium">{entry.likes}</span>}
                                            </button>
                                        </div>
                                    </article>
                                ))}

                                {filteredEntries.length === 0 && searchQuery.trim() && (
                                    <div className="p-10 mt-6 bg-white dark:bg-card border border-stone-200 dark:border-neutral-800 border-dashed rounded-2xl text-center text-stone-500 dark:text-neutral-400">
                                        <Search size={44} className="mx-auto mb-3 text-stone-300 dark:text-neutral-600" />
                                        <p className="font-serif text-lg text-stone-800 dark:text-neutral-200">No matching entries found</p>
                                        <p className="text-sm mt-1.5 text-stone-400 dark:text-neutral-500">Try searching with a different keyword, name, or date.</p>
                                        <button
                                            onClick={() => setSearchQuery('')}
                                            className="mt-4 inline-flex items-center gap-1.5 text-xs font-semibold bg-stone-100 hover:bg-stone-200 dark:bg-surface dark:hover:bg-neutral-800 text-stone-700 dark:text-gold-400 border dark:border-neutral-800 px-4 py-2 rounded-xl transition-colors shadow-sm"
                                        >
                                            Reset Search
                                        </button>
                                    </div>
                                )}

                                {entries.length === 0 && (
                                    <div className="p-10 mt-6 bg-white dark:bg-card border border-stone-200 dark:border-neutral-800 border-dashed rounded-2xl text-center text-stone-500 dark:text-neutral-400">
                                        <BookOpen size={48} className="mx-auto mb-4 text-stone-300 dark:text-gold-500/40" />
                                        <p className="font-serif text-lg dark:text-neutral-200">This journal is empty.</p>
                                        <p className="text-sm mt-2 dark:text-neutral-500">Write your first entry or restore a backup to begin.</p>
                                    </div>
                                )}
                            </div>
                        </main>

                        {/* --- RIGHT SIDEBAR --- */}
                        <aside className="hidden lg:block w-[350px] pl-8 py-6 bg-[#FAF8F5] dark:bg-pitch transition-colors">
                            <div className="sticky top-6">
                                <div className="bg-white dark:bg-surface rounded-xl shadow-sm border border-stone-200 dark:border-neutral-800 flex items-center px-4 py-3 mb-8 focus-within:ring-2 focus-within:ring-stone-300 dark:focus-within:ring-gold-500/30 focus-within:border-stone-400 dark:focus-within:border-gold-500/60 transition-all">
                                    <Search size={20} className="text-stone-400 dark:text-neutral-500 flex-shrink-0" />
                                    <input
                                        ref={searchInputRef}
                                        type="text"
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        placeholder="Search entries, keywords, dates..."
                                        className="bg-transparent border-none outline-none text-stone-800 dark:text-neutral-100 ml-3 w-full placeholder-stone-400 dark:placeholder-neutral-600 font-medium text-sm"
                                    />
                                    {searchQuery && (
                                        <button
                                            type="button"
                                            onClick={() => setSearchQuery('')}
                                            className="text-stone-400 hover:text-stone-600 dark:text-neutral-500 dark:hover:text-neutral-200 p-1 rounded-full hover:bg-stone-100 dark:hover:bg-neutral-800 transition-colors ml-1"
                                            title="Clear search"
                                        >
                                            <X size={16} />
                                        </button>
                                    )}
                                </div>

                                <div className="bg-white dark:bg-card border border-stone-200 dark:border-neutral-800 rounded-2xl p-6 shadow-sm">
                                    <h2 className="font-bold text-lg font-serif text-stone-800 dark:text-neutral-100 mb-1">Writing Prompts</h2>
                                    <p className="text-xs text-stone-400 dark:text-gold-500/80 mb-5">Click any prompt to start writing</p>
                                    <TrendItem
                                        category="Reflection · Daily"
                                        topic="What made you smile today?"
                                        desc="Focus on the little joys."
                                        onClick={() => handlePromptClick("What made you smile today?")}
                                    />
                                    <TrendItem
                                        category="Growth · Deep"
                                        topic="A recent lesson learned."
                                        desc="How have you evolved this week?"
                                        onClick={() => handlePromptClick("A recent lesson learned:")}
                                    />
                                    <TrendItem
                                        category="Vision · Future"
                                        topic="Where are you heading?"
                                        desc="Describe a goal you are working towards."
                                        onClick={() => handlePromptClick("Where am I heading? My current goal:")}
                                    />
                                </div>
                            </div>
                        </aside>
                    </div>

                    {/* --- EDIT PROFILE MODAL --- */}
                    {isEditingProfile && (
                        <div className="fixed inset-0 bg-stone-900/40 dark:bg-black/85 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white dark:bg-card border border-stone-200 dark:border-neutral-800 rounded-2xl p-8 w-full max-w-md shadow-xl dark:shadow-2xl">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-bold font-serif text-stone-800 dark:text-neutral-100">Edit Profile</h2>
                                    <button onClick={() => setIsEditingProfile(false)} className="text-stone-400 hover:text-stone-800 dark:text-neutral-500 dark:hover:text-neutral-200 transition-colors p-2 rounded-full hover:bg-stone-100 dark:hover:bg-neutral-800">
                                        <X size={20} />
                                    </button>
                                </div>

                                <form onSubmit={handleSaveProfile} className="flex flex-col gap-5">
                                    <div className="flex justify-center mb-4">
                                        <div className="relative group cursor-pointer" onClick={() => avatarInputRef.current?.click()} title="Change Profile Picture">
                                            <img
                                                src={editProfileData.avatar}
                                                alt="Profile Preview"
                                                className="w-28 h-28 rounded-full border-4 border-white dark:border-gold-500/60 shadow-md object-cover bg-stone-100 dark:bg-black"
                                            />
                                            <div className="absolute inset-0 bg-stone-900/40 dark:bg-black/60 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity backdrop-blur-sm">
                                                <Camera size={28} className="text-white dark:text-gold-400" />
                                            </div>
                                            <input type="file" accept="image/*" ref={avatarInputRef} onChange={handleAvatarSelect} className="hidden" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold text-stone-600 dark:text-neutral-400 mb-1.5">Journal Name</label>
                                        <input
                                            type="text"
                                            value={editProfileData.name}
                                            onChange={e => setEditProfileData({ ...editProfileData, name: e.target.value })}
                                            className="w-full bg-[#FAF8F5] dark:bg-surface border border-stone-300 dark:border-neutral-800 rounded-xl p-3.5 text-stone-800 dark:text-neutral-100 outline-none focus:border-stone-500 dark:focus:border-gold-500/60 focus:ring-1 focus:ring-stone-500 dark:focus:ring-gold-500/30 transition-all font-medium"
                                            required
                                            maxLength="50"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-stone-600 dark:text-neutral-400 mb-1.5">Author Handle</label>
                                        <input
                                            type="text"
                                            value={editProfileData.handle}
                                            onChange={e => setEditProfileData({ ...editProfileData, handle: e.target.value })}
                                            className="w-full bg-[#FAF8F5] dark:bg-surface border border-stone-300 dark:border-neutral-800 rounded-xl p-3.5 text-stone-800 dark:text-neutral-100 outline-none focus:border-stone-500 dark:focus:border-gold-500/60 focus:ring-1 focus:ring-stone-500 dark:focus:ring-gold-500/30 transition-all font-medium"
                                            required
                                            maxLength="20"
                                        />
                                    </div>

                                    <button
                                        type="submit"
                                        className="mt-4 bg-stone-800 hover:bg-stone-900 text-white dark:bg-gradient-to-r dark:from-gold-600 dark:via-gold-500 dark:to-gold-400 dark:hover:from-gold-500 dark:hover:to-gold-300 dark:text-black font-bold py-3.5 px-4 rounded-xl transition-all w-full shadow-md dark:shadow-[0_0_15px_rgba(212,175,55,0.3)]"
                                    >
                                        Save Changes
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function SidebarItem({ icon, label, active }) {
            return (
                <div className={`flex items-center gap-4 p-3 rounded-xl cursor-pointer transition-all w-full lg:w-auto ${
                    active
                        ? 'bg-stone-200/60 text-stone-900 font-semibold dark:bg-gold-500/10 dark:text-gold-400 dark:border dark:border-gold-500/30 dark:shadow-[0_0_10px_rgba(212,175,55,0.1)]'
                        : 'text-stone-600 hover:bg-stone-200/40 hover:text-stone-900 dark:text-neutral-400 dark:hover:bg-surface dark:hover:text-neutral-200 border border-transparent'
                }`}>
                    {icon}
                    <span className="hidden lg:inline text-[17px]">{label}</span>
                </div>
            );
        }

        function TrendItem({ category, topic, desc, onClick }) {
            return (
                <div onClick={onClick} className="mb-5 last:mb-0 cursor-pointer group p-3 -mx-3 rounded-xl hover:bg-stone-50 dark:hover:bg-surface border border-transparent dark:hover:border-neutral-800 transition-all">
                    <div className="text-xs font-semibold text-stone-400 dark:text-gold-500/75 flex justify-between uppercase tracking-wider mb-1">
                        <span>{category}</span>
                    </div>
                    <div className="font-bold text-[15px] text-stone-800 dark:text-neutral-200 group-hover:text-stone-600 dark:group-hover:text-gold-300 transition-colors">{topic}</div>
                    <div className="text-sm text-stone-500 dark:text-neutral-500 mt-1 leading-snug">{desc}</div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
