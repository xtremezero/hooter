<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journals 📔</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .journal-text {
            font-family: 'Lora', serif;
        }
    </style>
</head>

<body class="bg-[#FAF8F5] text-stone-800 font-sans selection:bg-stone-300 selection:text-stone-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Inline SVG Icons ---
        const Icon = ({ d, size = 24, className = "", fill = "none" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} fill={fill} dangerouslySetInnerHTML={{ __html: d }} />
        );

        const BookOpen = (p) => <Icon {...p} d='<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>' />;
        const Home = (p) => <Icon {...p} d='<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>' />;
        const Search = (p) => <Icon {...p} d='<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>' />;
        const Download = (p) => <Icon {...p} d='<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>' />;
        const Upload = (p) => <Icon {...p} d='<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>' />;
        const ImageIcon = (p) => <Icon {...p} d='<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>' />;
        const PenTool = (p) => <Icon {...p} d='<path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.586 7.586"/><circle cx="11" cy="11" r="2"/>' />;
        const Trash2 = (p) => <Icon {...p} d='<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>' />;
        const Heart = (p) => <Icon {...p} d='<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>' />;
        const X = (p) => <Icon {...p} d='<path d="M18 6 6 18"/><path d="m6 6 12 12"/>' />;
        const Camera = (p) => <Icon {...p} d='<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>' />;

        const defaultUser = {
            id: 'user_1',
            name: 'Dear Diary',
            handle: '@mythoughts',
            avatar: 'data:image/svg+xml;charset=UTF-8,%3csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23faf8f5" stroke="%2344403c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="background-color:%23e7e5e4;"%3e%3cpath d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/%3e%3cpath d="M8 7h6" stroke="%23a8a29e"/%3e%3cpath d="M8 11h4" stroke="%23a8a29e"/%3e%3cpath d="m18 6-7.5 7.5-2 1 1-2L17 5l2 1z" fill="%23d6d3d1"/%3e%3cpath d="m16.5 5.5 1 1"/%3e%3c/svg%3e'
        };

        const defaultEntries = [
            {
                id: 'e_1',
                author: defaultUser,
                content: 'Welcome to your new digital journal. Your thoughts are stored securely in your browser. \n\nTake a moment to reflect on your day, attach a memory, or just let your thoughts flow. Use the Backup and Restore buttons to save your entries.',
                timestamp: new Date().toISOString(),
                likes: 1,
                likedByMe: true
            }
        ];

        // Utility: Compress image to prevent base64 payload from exceeding localStorage limits
        const resizeImage = (file, maxWidth, callback) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        // Utility: Highlight matching search query substrings
        function HighlightText({ text = "", query = "" }) {
            const trimmedQuery = query.trim();
            if (!trimmedQuery || !text) return <span>{text}</span>;

            try {
                const escaped = trimmedQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`(${escaped})`, 'gi');
                const parts = String(text).split(regex);

                return (
                    <span>
                        {parts.map((part, index) =>
                            part.toLowerCase() === trimmedQuery.toLowerCase() ? (
                                <mark key={index} className="bg-amber-200 text-stone-900 rounded px-0.5 font-medium">
                                    {part}
                                </mark>
                            ) : (
                                part
                            )
                        )}
                    </span>
                );
            } catch (e) {
                return <span>{text}</span>;
            }
        }

        function App() {
            const [entries, setEntries] = useState([]);
            const [currentUser, setCurrentUser] = useState(defaultUser);

            const [entryInput, setEntryInput] = useState('');
            const [selectedImage, setSelectedImage] = useState(null);

            const [isEditingProfile, setIsEditingProfile] = useState(false);
            const [editProfileData, setEditProfileData] = useState(currentUser);

            // Search state
            const [searchQuery, setSearchQuery] = useState('');
            const [isMobileSearchOpen, setIsMobileSearchOpen] = useState(false);

            const fileInputRef = useRef(null);
            const imageInputRef = useRef(null);
            const avatarInputRef = useRef(null);
            const searchInputRef = useRef(null);
            const mobileSearchInputRef = useRef(null);

            useEffect(() => {
                try {
                    const storedEntries = localStorage.getItem('local_journal_entries') || localStorage.getItem('local_hooter_hoots');
                    const storedUser = localStorage.getItem('local_journal_user') || localStorage.getItem('local_hooter_user');

                    if (storedEntries) setEntries(JSON.parse(storedEntries));
                    else setEntries(defaultEntries);

                    if (storedUser) {
                        const parsedUser = JSON.parse(storedUser);
                        if (parsedUser.avatar && parsedUser.avatar.includes('dicebear.com/7.x/notionists')) {
                            parsedUser.avatar = defaultUser.avatar;
                        }
                        setCurrentUser(parsedUser);
                    }
                } catch (e) {
                    console.error('Failed to load local data', e);
                    setEntries(defaultEntries);
                }
            }, []);

            useEffect(() => {
                try {
                    localStorage.setItem('local_journal_entries', JSON.stringify(entries));
                    localStorage.setItem('local_journal_user', JSON.stringify(currentUser));
                } catch (e) {
                    console.error('Storage quota exceeded or error saving data', e);
                }
            }, [entries, currentUser]);

            const formatTime = (isoString) => {
                const date = new Date(isoString);
                return date.toLocaleDateString('en-US', {
                    weekday: 'long',
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric',
                    hour: 'numeric',
                    minute: '2-digit'
                });
            };

            // Live filter entries according to the current search query
            const filteredEntries = useMemo(() => {
                const q = searchQuery.trim().toLowerCase();
                if (!q) return entries;

                return entries.filter((entry) => {
                    const contentMatch = (entry.content || '').toLowerCase().includes(q);
                    const authorNameMatch = (entry.author?.name || '').toLowerCase().includes(q);
                    const authorHandleMatch = (entry.author?.handle || '').toLowerCase().includes(q);
                    const dateMatch = formatTime(entry.timestamp).toLowerCase().includes(q);

                    return contentMatch || authorNameMatch || authorHandleMatch || dateMatch;
                });
            }, [entries, searchQuery]);

            const handleImageSelect = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                resizeImage(file, 800, setSelectedImage);
                e.target.value = '';
            };

            const handleAvatarSelect = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                resizeImage(file, 200, (resizedDataUrl) => {
                    setEditProfileData({ ...editProfileData, avatar: resizedDataUrl });
                });
                e.target.value = '';
            };

            const handlePostEntry = (e) => {
                e.preventDefault();
                if (!entryInput.trim() && !selectedImage) return;

                const newEntry = {
                    id: `e_${Date.now()}`,
                    author: currentUser,
                    content: entryInput.trim(),
                    image: selectedImage,
                    timestamp: new Date().toISOString(),
                    likes: 0,
                    likedByMe: false
                };

                setEntries([newEntry, ...entries]);
                setEntryInput('');
                setSelectedImage(null);
            };

            const toggleLike = (entryId) => {
                setEntries(entries.map(e => {
                    if (e.id === entryId) {
                        return { ...e, likes: e.likedByMe ? e.likes - 1 : e.likes + 1, likedByMe: !e.likedByMe };
                    }
                    return e;
                }));
            };

            const deleteEntry = (entryId) => setEntries(entries.filter(e => e.id !== entryId));

            const handleSaveProfile = (e) => {
                e.preventDefault();
                setCurrentUser(editProfileData);
                setEntries(entries.map(en => en.author.id === currentUser.id ? { ...en, author: editProfileData } : en));
                setIsEditingProfile(false);
            };

            const handleBackup = () => {
                const exportData = { version: '1.0', timestamp: new Date().toISOString(), entries, user: currentUser };
                const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `journal-backup-${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            const handleRestoreFile = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.entries) setEntries(data.entries);
                        else if (data.hoots) setEntries(data.hoots);

                        if (data.user) setCurrentUser(data.user);
                    } catch (err) {
                        console.error("Failed to parse backup file.", err);
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const handlePromptClick = (topicText) => {
                setEntryInput((prev) => (prev ? `${prev}\n\n${topicText}\n` : `${topicText}\n`));
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const currentDateStr = new Date().toLocaleDateString('en-US', {
                weekday: 'long',
                month: 'long',
                day: 'numeric'
            });

            return (
                <div className="min-h-screen">
                    <div className="max-w-7xl mx-auto flex sm:px-6 lg:px-8">

                        {/* --- SIDEBAR --- */}
                        <header className="w-20 lg:w-64 py-4 flex flex-col justify-between sticky top-0 h-screen border-r border-stone-200">
                            <div className="flex flex-col items-center lg:items-start gap-2 lg:gap-4 px-2 lg:px-6">
                                <div className="p-3 mb-2 flex items-center gap-3 text-stone-800">
                                    <BookOpen size={32} className="text-stone-700" />
                                    <span className="hidden lg:block text-2xl font-bold tracking-tight font-serif">Journals</span>
                                </div>
                                <SidebarItem icon={<Home size={26} />} label="My Journal" active />

                                <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="hidden lg:flex w-full mt-4 bg-stone-800 hover:bg-stone-700 text-stone-50 font-semibold py-3 px-8 rounded-xl justify-center transition-all shadow-md">
                                    Write Entry
                                </button>
                                <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="lg:hidden mt-4 bg-stone-800 hover:bg-stone-700 text-stone-50 p-3 rounded-full transition-all shadow-md">
                                    <PenTool size={24} />
                                </button>
                            </div>

                            <div className="px-2 lg:px-6 flex flex-col gap-2">
                                <div className="hidden lg:block text-xs text-stone-400 mb-2 uppercase tracking-widest font-semibold">Data</div>
                                <button onClick={handleBackup} className="flex items-center gap-4 p-3 hover:bg-stone-200/50 rounded-xl cursor-pointer transition-colors w-full text-left text-stone-600 hover:text-stone-900">
                                    <Download size={22} />
                                    <span className="hidden lg:inline text-[17px] font-medium">Backup</span>
                                </button>
                                <button onClick={() => fileInputRef.current?.click()} className="flex items-center gap-4 p-3 hover:bg-stone-200/50 rounded-xl cursor-pointer transition-colors w-full text-left text-stone-600 hover:text-stone-900">
                                    <Upload size={22} />
                                    <span className="hidden lg:inline text-[17px] font-medium">Restore</span>
                                </button>
                                <input type="file" accept=".json" ref={fileInputRef} onChange={handleRestoreFile} className="hidden" />

                                <div
                                    onClick={() => { setEditProfileData(currentUser); setIsEditingProfile(true); }}
                                    className="mt-6 flex items-center gap-3 p-3 bg-white border border-stone-200 hover:border-stone-300 shadow-sm rounded-xl cursor-pointer transition-all w-full group"
                                >
                                    <img src={currentUser.avatar} alt="avatar" className="w-10 h-10 rounded-full bg-stone-100 object-cover border border-stone-200" />
                                    <div className="hidden lg:block flex-1 truncate">
                                        <p className="font-semibold text-sm leading-tight text-stone-800">{currentUser.name}</p>
                                        <p className="text-stone-500 text-xs mt-0.5 leading-tight">{currentUser.handle}</p>
                                    </div>
                                </div>
                            </div>
                        </header>

                        {/* --- MAIN CONTENT --- */}
                        <main className="flex-1 max-w-[650px] border-r border-stone-200 min-h-screen bg-[#FAF8F5]">
                            <div className="sticky top-0 z-10 bg-[#FAF8F5]/95 backdrop-blur-md border-b border-stone-200 p-4 sm:p-6 transition-all">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <p className="text-xs sm:text-sm font-medium text-stone-400 uppercase tracking-widest mb-1">{currentDateStr}</p>
                                        <h1 className="text-xl sm:text-2xl font-bold font-serif text-stone-800">Your Entries</h1>
                                    </div>

                                    {/* Mobile search toggle button */}
                                    <div className="flex items-center gap-2 lg:hidden">
                                        <button
                                            type="button"
                                            onClick={() => {
                                                setIsMobileSearchOpen(!isMobileSearchOpen);
                                                if (!isMobileSearchOpen) {
                                                    setTimeout(() => mobileSearchInputRef.current?.focus(), 100);
                                                }
                                            }}
                                            className={`p-2.5 rounded-xl border transition-colors ${isMobileSearchOpen || searchQuery ? 'bg-stone-800 text-stone-50 border-stone-800 shadow-sm' : 'bg-white text-stone-600 border-stone-200 hover:bg-stone-100'}`}
                                            title="Search entries"
                                        >
                                            <Search size={18} />
                                        </button>
                                    </div>
                                </div>

                                {/* Mobile Search Bar Accordion */}
                                {isMobileSearchOpen && (
                                    <div className="mt-3.5 pt-3 border-t border-stone-200 lg:hidden">
                                        <div className="bg-white rounded-xl shadow-inner border border-stone-300 flex items-center px-3.5 py-2">
                                            <Search size={18} className="text-stone-400 flex-shrink-0" />
                                            <input
                                                ref={mobileSearchInputRef}
                                                type="text"
                                                value={searchQuery}
                                                onChange={(e) => setSearchQuery(e.target.value)}
                                                placeholder="Search entries, keywords, dates..."
                                                className="bg-transparent border-none outline-none text-stone-800 ml-2.5 w-full placeholder-stone-400 text-sm font-medium"
                                            />
                                            {searchQuery && (
                                                <button
                                                    type="button"
                                                    onClick={() => setSearchQuery('')}
                                                    className="text-stone-400 hover:text-stone-700 p-1 ml-1"
                                                    title="Clear search"
                                                >
                                                    <X size={16} />
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* COMPOSER (hidden during active search for a clean focus mode) */}
                            {!searchQuery.trim() && (
                                <div className="p-6 border-b border-stone-200 bg-white">
                                    <form onSubmit={handlePostEntry} className="flex flex-col">
                                        <div className="flex gap-4 mb-4">
                                            <img src={currentUser.avatar} alt="avatar" className="w-10 h-10 rounded-full bg-stone-100 flex-shrink-0 object-cover border border-stone-200" />
                                            <textarea
                                                className="w-full bg-transparent text-xl placeholder-stone-400 outline-none resize-none border-none focus:ring-0 journal-text mt-1 text-stone-700"
                                                placeholder="What's on your mind today?"
                                                rows={4}
                                                value={entryInput}
                                                onChange={(e) => setEntryInput(e.target.value)}
                                            />
                                        </div>

                                        {selectedImage && (
                                            <div className="relative mb-4 ml-14 inline-block">
                                                <img src={selectedImage} alt="Preview" className="max-h-64 rounded-xl shadow-sm border border-stone-200 object-contain" />
                                                <button
                                                    type="button"
                                                    onClick={() => setSelectedImage(null)}
                                                    className="absolute top-2 right-2 bg-stone-800/80 hover:bg-stone-900 text-white p-1.5 rounded-full transition-colors backdrop-blur-sm"
                                                >
                                                    <X size={16} />
                                                </button>
                                            </div>
                                        )}

                                        <div className="flex justify-between items-center ml-14 border-t border-stone-100 pt-3">
                                            <div className="flex gap-2 text-stone-400">
                                                <button type="button" onClick={() => imageInputRef.current?.click()} className="p-2 hover:bg-stone-100 hover:text-stone-700 rounded-full cursor-pointer transition-colors" title="Attach an image">
                                                    <ImageIcon size={20} />
                                                </button>
                                                <input type="file" accept="image/*" ref={imageInputRef} onChange={handleImageSelect} className="hidden" />
                                            </div>
                                            <button
                                                type="submit"
                                                disabled={!entryInput.trim() && !selectedImage}
                                                className="bg-stone-800 hover:bg-stone-700 disabled:opacity-40 disabled:cursor-not-allowed text-stone-50 font-semibold py-2 px-6 rounded-full transition-all text-sm shadow-sm"
                                            >
                                                Save Entry
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            )}

                            {/* FEED */}
                            <div className="p-6 pb-20 space-y-6">
                                {/* Search Status Bar */}
                                {searchQuery.trim() && (
                                    <div className="flex items-center justify-between bg-stone-100/90 border border-stone-200 px-4 py-3 rounded-xl shadow-sm">
                                        <div className="text-sm text-stone-600 flex items-center gap-2">
                                            <Search size={16} className="text-stone-400" />
                                            <span>
                                                Found <span className="font-bold text-stone-900">{filteredEntries.length}</span> {filteredEntries.length === 1 ? 'entry' : 'entries'} for &ldquo;<span className="font-semibold text-stone-800">{searchQuery}</span>&rdquo;
                                            </span>
                                        </div>
                                        <button
                                            onClick={() => setSearchQuery('')}
                                            className="text-xs font-semibold text-stone-500 hover:text-stone-900 underline ml-3 transition-colors"
                                        >
                                            Clear search
                                        </button>
                                    </div>
                                )}

                                {filteredEntries.map(entry => (
                                    <article key={entry.id} className="bg-white border border-stone-200 rounded-2xl p-6 shadow-sm hover:shadow-md transition-shadow">
                                        <div className="flex justify-between items-start mb-4 border-b border-stone-100 pb-4">
                                            <div className="flex items-center gap-3">
                                                <img src={entry.author.avatar} alt="avatar" className="w-10 h-10 rounded-full bg-stone-100 flex-shrink-0 object-cover border border-stone-200" />
                                                <div>
                                                    <div className="font-semibold text-stone-800">
                                                        <HighlightText text={entry.author.name} query={searchQuery} />
                                                    </div>
                                                    <div className="text-xs text-stone-500 font-medium">
                                                        <HighlightText text={formatTime(entry.timestamp)} query={searchQuery} />
                                                    </div>
                                                </div>
                                            </div>

                                            {entry.author.id === currentUser.id && (
                                                <button onClick={() => deleteEntry(entry.id)} className="text-stone-300 hover:text-red-500 p-2 rounded-full hover:bg-red-50 transition-colors" title="Delete Entry">
                                                    <Trash2 size={18} />
                                                </button>
                                            )}
                                        </div>

                                        <p className="journal-text text-[17px] text-stone-800 whitespace-pre-wrap break-words leading-relaxed">
                                            <HighlightText text={entry.content} query={searchQuery} />
                                        </p>

                                        {entry.image && (
                                            <img src={entry.image} alt="Journal attachment" className="mt-5 rounded-xl w-full border border-stone-200 shadow-sm object-cover max-h-[500px]" />
                                        )}

                                        <div className="flex justify-start mt-4 border-t border-stone-50 pt-3 text-stone-400">
                                            <button
                                                onClick={() => toggleLike(entry.id)}
                                                className={`flex items-center gap-2 group transition-colors ${entry.likedByMe ? 'text-amber-500' : 'hover:text-amber-500'}`}
                                                title="Favorite this entry"
                                            >
                                                <div className="p-2 rounded-full group-hover:bg-amber-50 transition-colors">
                                                    <Heart size={20} fill={entry.likedByMe ? 'currentColor' : 'none'} className={entry.likedByMe ? 'text-amber-500' : ''} />
                                                </div>
                                                {entry.likes > 0 && <span className="text-sm font-medium">{entry.likes}</span>}
                                            </button>
                                        </div>
                                    </article>
                                ))}

                                {/* Empty state for Search Results */}
                                {filteredEntries.length === 0 && searchQuery.trim() && (
                                    <div className="p-10 mt-6 bg-white border border-stone-200 border-dashed rounded-2xl text-center text-stone-500">
                                        <Search size={44} className="mx-auto mb-3 text-stone-300" />
                                        <p className="font-serif text-lg text-stone-800">No matching entries found</p>
                                        <p className="text-sm mt-1.5 text-stone-400">Try searching with a different keyword, name, or date.</p>
                                        <button
                                            onClick={() => setSearchQuery('')}
                                            className="mt-4 inline-flex items-center gap-1.5 text-xs font-semibold bg-stone-100 hover:bg-stone-200 text-stone-700 px-4 py-2 rounded-xl transition-colors shadow-sm"
                                        >
                                            Reset Search
                                        </button>
                                    </div>
                                )}

                                {/* Empty state when no entries exist at all */}
                                {entries.length === 0 && (
                                    <div className="p-10 mt-6 bg-white border border-stone-200 border-dashed rounded-2xl text-center text-stone-500">
                                        <BookOpen size={48} className="mx-auto mb-4 text-stone-300" />
                                        <p className="font-serif text-lg">This journal is empty.</p>
                                        <p className="text-sm mt-2">Write your first entry or restore a backup to begin.</p>
                                    </div>
                                )}
                            </div>
                        </main>

                        {/* --- RIGHT SIDEBAR --- */}
                        <aside className="hidden lg:block w-[350px] pl-8 py-6">
                            <div className="sticky top-6">
                                <div className="bg-white rounded-xl shadow-sm border border-stone-200 flex items-center px-4 py-3 mb-8 focus-within:ring-2 focus-within:ring-stone-300 focus-within:border-stone-400 transition-all">
                                    <Search size={20} className="text-stone-400 flex-shrink-0" />
                                    <input
                                        ref={searchInputRef}
                                        type="text"
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        placeholder="Search entries, keywords, dates..."
                                        className="bg-transparent border-none outline-none text-stone-800 ml-3 w-full placeholder-stone-400 font-medium text-sm"
                                    />
                                    {searchQuery && (
                                        <button
                                            type="button"
                                            onClick={() => setSearchQuery('')}
                                            className="text-stone-400 hover:text-stone-600 p-1 rounded-full hover:bg-stone-100 transition-colors ml-1"
                                            title="Clear search"
                                        >
                                            <X size={16} />
                                        </button>
                                    )}
                                </div>

                                <div className="bg-white border border-stone-200 rounded-2xl p-6 shadow-sm">
                                    <h2 className="font-bold text-lg font-serif text-stone-800 mb-1">Writing Prompts</h2>
                                    <p className="text-xs text-stone-400 mb-5">Click any prompt to start writing</p>
                                    <TrendItem
                                        category="Reflection · Daily"
                                        topic="What made you smile today?"
                                        desc="Focus on the little joys."
                                        onClick={() => handlePromptClick("What made you smile today?")}
                                    />
                                    <TrendItem
                                        category="Growth · Deep"
                                        topic="A recent lesson learned."
                                        desc="How have you evolved this week?"
                                        onClick={() => handlePromptClick("A recent lesson learned:")}
                                    />
                                    <TrendItem
                                        category="Vision · Future"
                                        topic="Where are you heading?"
                                        desc="Describe a goal you are working towards."
                                        onClick={() => handlePromptClick("Where am I heading? My current goal:")}
                                    />
                                </div>
                            </div>
                        </aside>
                    </div>

                    {/* --- EDIT PROFILE MODAL --- */}
                    {isEditingProfile && (
                        <div className="fixed inset-0 bg-stone-900/40 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white border border-stone-200 rounded-2xl p-8 w-full max-w-md shadow-xl">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-bold font-serif text-stone-800">Edit Profile</h2>
                                    <button onClick={() => setIsEditingProfile(false)} className="text-stone-400 hover:text-stone-800 transition-colors p-2 rounded-full hover:bg-stone-100">
                                        <X size={20} />
                                    </button>
                                </div>

                                <form onSubmit={handleSaveProfile} className="flex flex-col gap-5">
                                    <div className="flex justify-center mb-4">
                                        <div className="relative group cursor-pointer" onClick={() => avatarInputRef.current?.click()} title="Change Profile Picture">
                                            <img
                                                src={editProfileData.avatar}
                                                alt="Profile Preview"
                                                className="w-28 h-28 rounded-full border-4 border-white shadow-md object-cover bg-stone-100"
                                            />
                                            <div className="absolute inset-0 bg-stone-900/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity backdrop-blur-sm">
                                                <Camera size={28} className="text-white" />
                                            </div>
                                            <input type="file" accept="image/*" ref={avatarInputRef} onChange={handleAvatarSelect} className="hidden" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold text-stone-600 mb-1.5">Journal Name</label>
                                        <input
                                            type="text"
                                            value={editProfileData.name}
                                            onChange={e => setEditProfileData({ ...editProfileData, name: e.target.value })}
                                            className="w-full bg-[#FAF8F5] border border-stone-300 rounded-xl p-3.5 text-stone-800 outline-none focus:border-stone-500 focus:ring-1 focus:ring-stone-500 transition-all font-medium"
                                            required
                                            maxLength="50"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-stone-600 mb-1.5">Author Handle</label>
                                        <input
                                            type="text"
                                            value={editProfileData.handle}
                                            onChange={e => setEditProfileData({ ...editProfileData, handle: e.target.value })}
                                            className="w-full bg-[#FAF8F5] border border-stone-300 rounded-xl p-3.5 text-stone-800 outline-none focus:border-stone-500 focus:ring-1 focus:ring-stone-500 transition-all font-medium"
                                            required
                                            maxLength="20"
                                        />
                                    </div>

                                    <button type="submit" className="mt-4 bg-stone-800 hover:bg-stone-900 text-white font-bold py-3.5 px-4 rounded-xl transition-all w-full shadow-md">
                                        Save Changes
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function SidebarItem({ icon, label, active }) {
            return (
                <div className={`flex items-center gap-4 p-3 rounded-xl cursor-pointer transition-colors w-full lg:w-auto ${active ? 'bg-stone-200/60 text-stone-900 font-semibold' : 'text-stone-600 hover:bg-stone-200/40 hover:text-stone-900'}`}>
                    {icon}
                    <span className="hidden lg:inline text-[17px]">{label}</span>
                </div>
            );
        }

        function TrendItem({ category, topic, desc, onClick }) {
            return (
                <div onClick={onClick} className="mb-5 last:mb-0 cursor-pointer group p-2.5 -mx-2.5 rounded-xl hover:bg-stone-50 transition-colors">
                    <div className="text-xs font-semibold text-stone-400 flex justify-between uppercase tracking-wider mb-1">
                        <span>{category}</span>
                    </div>
                    <div className="font-bold text-[15px] text-stone-800 group-hover:text-stone-600 transition-colors">{topic}</div>
                    <div className="text-sm text-stone-500 mt-1 leading-snug">{desc}</div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
